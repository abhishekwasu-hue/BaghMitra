name: BagMitra API

on:
  push:
    branches: [main]
    paths: ["api/**", "docs/api/**", "product.env", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "docs/api/**", "product.env", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: api

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types (mypy --strict)
        run: mypy src tests alembic
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r src
      - name: Tests (coverage gate 85%)
        run: pytest
      - name: Knowledge-base safety modules (coverage gate 90%, addendum v1.3 §9)
        run: coverage report --include='src/bagmitra_api/kb/*' --fail-under=90
      - name: Feed matching, output check and alerts (coverage gate 90%, addendum v1.4 §7)
        run: coverage report --include='src/bagmitra_api/feed/matching.py,src/bagmitra_api/feed/output_check.py,src/bagmitra_api/feed/alerts.py' --fail-under=90
      - name: OpenAPI is up to date
        run: |
          python -m bagmitra_api.export_openapi /tmp/openapi.json
          diff -u ../docs/api/openapi.json /tmp/openapi.json

  migrations-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: bagmitra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Upgrade / downgrade / upgrade + RLS on every table
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:pg@localhost:5432/bagmitra
        run: pytest -m postgres --no-cov
