name: Release APK

# The production APK for growers (audit RL-01 / RL-02 / P1 / R5). Started by hand only, from main:
# GitHub -> Actions -> "Release APK" -> Run workflow. Steps for the owner: docs/runbooks/release-apk.md.
# - No DEV_GALLERY / TEST_BUILD: no developer screens, no test badge.
# - Signed with the owner's release key; the run stops when any of its four secrets is missing
#   (never the debug key), and the signature is checked after the build.
# - arm64-v8a and armeabi-v7a only (no x86_64, no universal), obfuscated, symbols kept briefly.
# - Both APKs carry the same version code: this workflow's run number, which only rises.
# - A Play App Bundle (.aab) for Google Play from the same key, run number and dart-defines: a
#   30-day workflow artifact only, never on the public release and never sent to Play by this
#   workflow (the owner uploads it in Play Console; docs/runbooks/release-apk.md §५).
# - Push alerts: on only when the secret GOOGLE_SERVICES_JSON_B64 is set (writes google-services.json,
#   adds --dart-define=PUSH=true to both builds); without it the builds are unchanged.
# The Test APK workflow (release-test-apk.yml) stays the testers' build (same version-code rule).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to growers, e.g. 1.0.0"
        required: true
        type: string
      sarkari_sandesh:
        description: "Sarkari Sandesh feed in this release"
        required: true
        default: "off"
        type: choice
        options: ["off", "on"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check inputs and secrets
        env:
          REF: ${{ github.ref }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          failed=0
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release APK workflow from main (this run is on $REF)"
            failed=1
          fi
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version_name must look like 1.0.0"
            failed=1
          fi
          # Without the release key the APK would not upgrade growers' installs; without the
          # server and login secrets it would run in the offline demo mode.
          for key in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                     API_BASE_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Secret $key is not set (docs/runbooks/release-apk.md)"
              failed=1
            fi
          done
          exit $failed
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Names and numbers
        id: meta
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          code="${{ github.run_number }}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=release-$VERSION_NAME-$code" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 does not decode to a file"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Push alerts (OPEN_QUESTIONS Q32, docs/runbooks/push-notifications.md §४): only when the
      # repository secret GOOGLE_SERVICES_JSON_B64 is set, write app/android/app/google-services.json
      # (gitignored; the Gradle google-services plugin is applied only when it exists) and build with
      # --dart-define=PUSH=true. Without the secret nothing is written and both builds run as before.
      - name: Push alerts config
        id: push
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "push=" >> "$GITHUB_OUTPUT"
            echo "- push: off (no GOOGLE_SERVICES_JSON_B64)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          file=app/android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$file" \
            || { echo "::error::GOOGLE_SERVICES_JSON_B64 is not valid base64"; exit 1; }
          python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$file" 2>/dev/null \
            || { echo "::error::GOOGLE_SERVICES_JSON_B64 does not decode to a JSON file"; exit 1; }
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "- push: on" >> "$GITHUB_STEP_SUMMARY"
      - name: Build production APKs
        working-directory: app
        env:
          RELEASE_BUILD: "true"
          BUILD_NUMBER: ${{ steps.meta.outputs.code }}
          BUILD_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SARKARI_SANDESH: ${{ inputs.sarkari_sandesh }}
          # Phone OTP login stays hidden until an SMS provider is set up (repository variable).
          PHONE_LOGIN: ${{ vars.PHONE_LOGIN || 'false' }}
          # Market link (spec v1.5): owner 2026-11-08 ("1 b") put it in the Release APK too, from
          # the same repository variable as the Test APK; the spec §5 legal-gate records are
          # still to be recorded in admin (OPEN_QUESTIONS Q117).
          MARKET_LINK: ${{ vars.MARKET_LINK || 'false' }}
          # Empty unless the push step wrote google-services.json.
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" \
            --android-project-arg=force-version-code-ignoring-abi=true \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file=../product.env \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SARKARI_SANDESH="$SARKARI_SANDESH" \
            --dart-define=PHONE_LOGIN="$PHONE_LOGIN" \
            --dart-define=MARKET_LINK="$MARKET_LINK" \
            ${PUSH:+--dart-define=PUSH=true}
      - name: Check signature and version codes
        env:
          CODE: ${{ steps.meta.outputs.code }}
          # Owner's release certificate SHA-256 (hex, colons allowed); audit L5. Default: the
          # release key (owner Q125, 2026-11-08; checked against release-1.0.1-2). A repository
          # variable RELEASE_CERT_SHA256 overrides it (e.g. after a key change).
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || 'C4:90:F1:8E:7B:80:C1:B3:1D:50:9B:C9:26:1C:5E:DF:1B:E4:31:74:30:3E:47:B0:B0:56:0A:BE:15:6A:A8:BA' }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          want=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$want" ]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set; the signing certificate is not pinned (docs/OPEN_QUESTIONS.md Q125)"
          fi
          apks=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a; do
            apk="$apks/app-$abi-release.apk"
            [ -f "$apk" ] || { echo "::error::$abi APK was not built"; exit 1; }
            certs=$("$tools/apksigner" verify --print-certs "$apk")
            if printf '%s' "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$abi APK is signed with the debug key"; exit 1
            fi
            signer=$(printf '%s' "$certs" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')
            if [ -n "$want" ] && [ "$signer" != "$want" ]; then
              echo "::error::$abi APK certificate $signer is not the release key"; exit 1
            fi
            got=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            [ "$got" = "$CODE" ] || { echo "::error::$abi versionCode is $got, expected $CODE"; exit 1; }
            echo "$abi: versionCode $got, $(printf '%s' "$certs" | grep -m1 'certificate SHA-256')"
          done
          for extra in app-x86_64-release.apk app-release.apk; do
            if [ -f "$apks/$extra" ]; then echo "::error::unexpected $extra"; exit 1; fi
          done
      - name: Name the files
        run: |
          out=release-files
          mkdir -p "$out"
          apks=app/build/app/outputs/flutter-apk
          prefix="bagmitra-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}"
          for abi in arm64-v8a armeabi-v7a; do
            cp "$apks/app-$abi-release.apk" "$out/$prefix-$abi.apk"
          done
          ls -l "$out"
      # Symbols turn obfuscated crash stacks back into names. Kept briefly; a full artifact quota
      # must not stop the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bagmitra-symbols-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}
          path: app/build/symbols
          retention-days: 7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          gh release create "$tag" release-files/*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "BagMitra ${{ steps.meta.outputs.name }} (version code ${{ steps.meta.outputs.code }})" \
            --notes "Production APKs. Nothing to set in .env: within an hour the VPS mirror (RELEASE_APK_MIRROR=on, deploy/fetch_test_apk.sh) serves the arm64-v8a file at /app and writes release.json, which /v1/app/version reads." \
            || gh release upload "$tag" release-files/*.apk --clobber
          {
            echo "### BagMitra ${{ steps.meta.outputs.name }}"
            echo "- version code: **${{ steps.meta.outputs.code }}**"
            echo "- release: $tag"
            echo "- server: nothing to set in .env; the VPS mirror updates /app and release.json (version) within an hour"
          } >> "$GITHUB_STEP_SUMMARY"
      # Google Play takes only an App Bundle (docs/store/pre-launch-checklist.md §A). Same env, run
      # number and dart-defines as the APKs above; its own symbol folder. Built after the APK release
      # is published, so a bundle problem never holds back the growers' APKs.
      - name: Build Play App Bundle
        working-directory: app
        env:
          RELEASE_BUILD: "true"
          BUILD_NUMBER: ${{ steps.meta.outputs.code }}
          BUILD_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SARKARI_SANDESH: ${{ inputs.sarkari_sandesh }}
          PHONE_LOGIN: ${{ vars.PHONE_LOGIN || 'false' }}
          MARKET_LINK: ${{ vars.MARKET_LINK || 'false' }}
          # Empty unless the push step wrote google-services.json.
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" \
            --obfuscate --split-debug-info=build/symbols-aab \
            --dart-define-from-file=../product.env \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SARKARI_SANDESH="$SARKARI_SANDESH" \
            --dart-define=PHONE_LOGIN="$PHONE_LOGIN" \
            --dart-define=MARKET_LINK="$MARKET_LINK" \
            ${PUSH:+--dart-define=PUSH=true}
      - name: Check the App Bundle
        env:
          CODE: ${{ steps.meta.outputs.code }}
          NAME: ${{ steps.meta.outputs.name }}
          # The same pinned release certificate as the APK check above (owner Q125).
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || 'C4:90:F1:8E:7B:80:C1:B3:1D:50:9B:C9:26:1C:5E:DF:1B:E4:31:74:30:3E:47:B0:B0:56:0A:BE:15:6A:A8:BA' }}
          # bundletool reads the version code from the bundle; the jar is pinned by its SHA-256.
          BUNDLETOOL_URL: https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          BUNDLETOOL_SHA256: 675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c
        run: |
          aab=app/build/app/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::the App Bundle was not built"; exit 1; }
          jarsigner -verify "$aab" | grep -q "jar verified." || { echo "::error::the App Bundle signature does not verify"; exit 1; }
          certs=$(keytool -printcert -jarfile "$aab")
          if printf '%s' "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::the App Bundle is signed with the debug key"; exit 1
          fi
          sha=$(printf '%s' "$certs" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -1)
          signer=$(printf '%s' "$sha" | tr -d ': ' | tr 'A-F' 'a-f')
          want=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$want" ]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set; the signing certificate is not pinned (docs/OPEN_QUESTIONS.md Q125)"
          elif [ "$signer" != "$want" ]; then
            echo "::error::App Bundle certificate $signer is not the release key"; exit 1
          fi
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" "$BUNDLETOOL_URL"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          dump() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" --xpath="/manifest/@android:$1"; }
          got=$(dump versionCode | tr -d '[:space:]')
          [ "$got" = "$CODE" ] || { echo "::error::App Bundle versionCode is $got, expected $CODE"; exit 1; }
          got_name=$(dump versionName | tr -d '[:space:]')
          [ "$got_name" = "$NAME" ] || { echo "::error::App Bundle versionName is $got_name, expected $NAME"; exit 1; }
          mkdir -p play-files
          file="bagmitra-play-$NAME-$CODE.aab"
          cp "$aab" "play-files/$file"
          size=$(stat -c %s "play-files/$file")
          echo "$file: $size bytes, versionName $got_name, versionCode $got, certificate SHA-256 $sha"
          {
            echo "### Play App Bundle"
            echo "- file: **$file** (workflow artifact, 30 days; not on the public release)"
            echo "- size: $size bytes ($(numfmt --to=iec "$size"))"
            echo "- version name / code: **$got_name** / **$got**"
            echo "- signing certificate SHA-256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bagmitra-play-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}.aab
          path: play-files/bagmitra-play-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}.aab
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bagmitra-play-symbols-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}
          path: app/build/symbols-aab
          retention-days: 30
