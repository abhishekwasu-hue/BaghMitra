name: Offline Q&A build

# Owner 2026-11-12 (OPEN_QUESTIONS Q144): the offline question-and-answer asset of the app's
# "विचारा" tab, written by the Anthropic API ONLY from checked material (practice cards and the
# sources they cite, label claims, the FCO extract, the app's own screens), every answer checked
# like the knowledge articles and dropped when a check fails. Runners can fetch the cited
# sources. Manual only. The run commits the new asset to a branch qa-data-<run id> and opens a
# pull request; nothing reaches main without a merge. The work file is kept in the Actions cache,
# so a run that stopped (time-out, API error) continues where it stopped when run again.
# Runbook: docs/runbooks/offline-qa.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "batch (Message Batches API, half price, can take longer) or concurrent"
        required: false
        default: batch
        type: choice
        options: [batch, concurrent]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qa-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEED_AI_API_KEY: ${{ secrets.FEED_AI_API_KEY }}
    steps:
      - name: Which API key secret is set (the name only, never the value)
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "API key: repository secret ANTHROPIC_API_KEY is set and is used."
          elif [ -n "$FEED_AI_API_KEY" ]; then
            echo "API key: ANTHROPIC_API_KEY is empty; repository secret FEED_AI_API_KEY is set and is used."
          else
            echo "::error::Neither ANTHROPIC_API_KEY nor FEED_AI_API_KEY is set as a repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install the API package
        working-directory: api
        run: pip install -e .
      - name: Restore the work file of an earlier run
        uses: actions/cache/restore@v4
        with:
          path: api/qa_work
          key: qa-work-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qa-work-
      - name: Build the questions and answers
        working-directory: api
        env:
          ENVIRONMENT: test
          MODE: ${{ inputs.mode }}
        run: |
          python -m bagmitra_api.kb.qa_build build \
            --out ../app/assets/config/qa_kb.json.gz \
            --work qa_work --app-root ../app --mode "${MODE:-batch}"
      - name: Keep the work file for the next run (also after a failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: api/qa_work
          key: qa-work-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-build-report
          path: |
            api/qa_work/qa_build_report.md
            api/qa_work/qa_build_cost.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit the asset to qa-data-<run> and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="qa-data-${RUN_ID}"
          report=api/qa_work/qa_build_report.md
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/assets/config/qa_kb.json.gz
          if git diff --cached --quiet; then
            echo "The asset did not change; no pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Offline Q&A asset from run ${RUN_ID}" \
            -m "Generated by .github/workflows/qa-build.yml (OPEN_QUESTIONS Q144)."
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
              --title "Offline Q&A data (run ${RUN_ID})" --body-file "$report"; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::warning::The branch $branch is pushed, but the pull request could not be opened (Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'). Open it here: $url"
            echo "Open the pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
