name: Card sources

# Owner 2026-11-10 (Q128 follow-up): the knowledge-card points that the AI did not find in their
# cited source are reviewed by reading the sources. This run fetches every source the cards cite
# (no secrets, no model call) and keeps, per point, the best-matching passages of each source and
# the numbers not found there, as a 7-day artifact for the reviewer. It changes nothing.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: extra page URLs (space-separated) whose visible text is printed, e.g. the right page of a section a card cites"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  passages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e .
      - name: Fetch the cited sources and write the reviewer file
        env:
          ENVIRONMENT: test
        run: |
          python -m bagmitra_api.kb.card_check ../app/assets/config/practice_cards.json \
            --passages "$RUNNER_TEMP/card_passages.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d), 'points')" \
            "$RUNNER_TEMP/card_passages.json"
          # The artifact store is not reachable from every reviewer's network; the job log is.
          echo "::group::card_passages.json"
          cat "$RUNNER_TEMP/card_passages.json"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: card-passages
          path: ${{ runner.temp }}/card_passages.json
          retention-days: 7
      - name: Print extra pages
        if: ${{ inputs.urls != '' }}
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python - <<'PY'
          import asyncio, os, re
          from urllib.parse import urljoin
          import httpx
          from bagmitra_api.feed.extract import extract
          from bagmitra_api.kb.card_check import fetch_text
          # Some government hosts answer 403 to a non-browser User-Agent: one retry with a
          # generic one. An HTML page also lists its document links, to find the right file.
          BROWSER = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"}
          async def main():
              async with httpx.AsyncClient(follow_redirects=True) as http:
                  for url in os.environ["URLS"].split():
                      text, reason = await fetch_text(http, url)
                      page = None
                      if reason == "HTTP 403" or not reason:
                          try:
                              page = await http.get(url, headers=BROWSER, timeout=60)
                          except httpx.HTTPError as exc:
                              reason = reason and f"{reason}; browser User-Agent: {exc!r}"
                      is_pdf = page is not None and page.content.startswith(b"%PDF")
                      if reason and page is not None:
                          if page.status_code >= 400:
                              reason += f"; browser User-Agent: HTTP {page.status_code}"
                          else:
                              text = extract(page.content, "pdf" if is_pdf else "html").text
                              reason = None if text.strip() else reason + "; no text"
                      print("::group::" + url)
                      print(reason or text[:200000])
                      if page is not None and page.status_code < 400 and not is_pdf:
                          for href in sorted(set(re.findall(r'href="([^"]+\.pdf[^"]*)"', page.text, re.I))):
                              print("LINK", urljoin(str(page.url), href))
                      print("::endgroup::")
          asyncio.run(main())
          PY
