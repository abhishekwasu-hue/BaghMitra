name: BagMitra App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "docs/api/**", "product.env", ".github/workflows/app.yml"]
  pull_request:
    # "labeled" lets the "emulator" label start the emulator jobs on a pull request.
    types: [opened, synchronize, reopened, labeled]
    paths: ["app/**", "docs/api/**", "product.env", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

env:
  # Goldens are rendered on Linux with this exact version; keep in sync with docs/runbooks/local-dev.md.
  FLUTTER_VERSION: "3.47.5"

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Which emulator-relevant paths a pull request touches.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      emulator: ${{ steps.filter.outputs.emulator }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            emulator:
              - 'app/integration_test/**'
              - 'app/android/**'
              - 'app/lib/core/**'
              - 'app/tool/emulator_ci.sh'
              - '.github/workflows/app.yml'

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: OpenAPI spec copy matches the API contract
        run: diff -u ../docs/api/openapi.json openapi/bagmitra.openapi.json
      - name: Regenerate API client, Drift code and l10n; fail on drift
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib > /dev/null
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests incl. goldens, offline->online sync, architecture rules
        run: flutter test --coverage
      - name: Logic coverage gate (80%)
        run: dart run tool/coverage_gate.dart 80
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: app/test/**/failures/

  apk:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (split per ABI keeps each download small)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=../product.env
      - name: Report APK sizes (budget < 25 MB)
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bagmitra-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  emulator:
    # The two emulator jobs take about 25 minutes each: they run on main (which gates the test APK),
    # by hand, and on pull requests that touch Android/integration/core code or carry the
    # "emulator" label. Other pull requests skip them.
    if: >-
      !cancelled() && needs.checks.result == 'success' && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.emulator == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'emulator'))
    name: emulator (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        # integration: debug build + integration_test. release: the R8-minified release build
        # installed and opened (separate runner, so the two heavy Gradle builds never share memory).
        mode: [integration, release]
    permissions:
      contents: read
      pull-requests: write
    # Headless Android emulator: API 33, pixel_5-class AVD, 2 GB RAM. Installs the debug build, runs the
    # integration tests in app/integration_test and uploads screenshots (OPEN_QUESTIONS Q4).
    runs-on: ubuntu-latest
    needs: [changes, checks]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Free runner disk (the system image needs several GB)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/microsoft /opt/az /usr/local/lib/heroku
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node
          docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Cache the Android system image and emulator
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-33/google_apis/x86_64
            /usr/local/lib/android/sdk/emulator
          key: android-33-google_apis-x86_64-v1
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on an emulator
        id: emu
        continue-on-error: true
        working-directory: app
        run: bash tool/emulator_ci.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.mode }}
          path: emulator-shots/
      - name: Show the end of the emulator test log on the pull request
        if: steps.emu.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          {
            echo "Emulator (${{ matrix.mode }}) failed on ${GITHUB_SHA::7}. End of the log:"
            echo '```'
            tail -n 40 emulator-shots/run.log 2>/dev/null || echo "(no run.log: the script did not start)"
            echo '```'
            echo "App errors from logcat:"
            echo '```'
            grep -E "FATAL|AndroidRuntime|E/flutter|E/DartVM|Exception|has died|ANR in" emulator-shots/logcat.txt 2>/dev/null | head -n 30 || true
            echo '```'
          } > emulator-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file emulator-comment.md
      - name: Fail when the emulator tests failed
        if: steps.emu.outcome == 'failure'
        run: exit 1
