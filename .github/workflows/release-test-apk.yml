name: Test APK

# Builds a signed release-mode APK for installing on a phone, and publishes it as a pre-release.
# Runs after the "BagMitra App" workflow (format, analyze, tests, goldens, emulator) succeeded on
# a push to main, so a test build only exists for a commit that passed those gates. It can also be
# started by hand. Setup: docs/runbooks/test-apk.md.
on:
  workflow_run:
    workflows: ["BagMitra App"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

# One release at a time; a run already uploading is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Names and numbers
        id: meta
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          base=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=${base}-${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=test-$(date -u +%Y%m%d)-${sha}" >> "$GITHUB_OUTPUT"
      - name: Test keystore (falls back to the debug key when the secrets are not set)
        env:
          KEYSTORE_B64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test.jks"
            echo "TEST_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TEST_KEYSTORE_BASE64 is not set; signing with the debug key"
          fi
      - name: Build release APKs
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: ${{ steps.meta.outputs.name }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          defines="--dart-define-from-file=../product.env --dart-define=DEV_GALLERY=true --dart-define=TEST_BUILD=${{ steps.meta.outputs.sha }}"
          flutter pub get
          flutter build apk --release $defines
          flutter build apk --release --split-per-abi $defines
      - name: Name the files
        run: |
          out=release-files
          mkdir -p "$out"
          apks=app/build/app/outputs/flutter-apk
          prefix="bagmitra-test-${{ steps.meta.outputs.name }}"
          cp "$apks/app-release.apk" "$out/$prefix-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "$apks/app-$abi-release.apk" ] && cp "$apks/app-$abi-release.apk" "$out/$prefix-$abi.apk"
          done
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: bagmitra-test-apk
          path: release-files/*.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          gh release create "$tag" release-files/*.apk \
            --prerelease --target "$(git rev-parse HEAD)" \
            --title "Test build $tag" --generate-notes \
            || gh release upload "$tag" release-files/*.apk --clobber
