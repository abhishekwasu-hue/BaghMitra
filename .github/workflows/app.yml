name: BagMitra App

on:
  push:
    branches: [main]
    paths: ["app/**", "docs/api/**", "product.env", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "docs/api/**", "product.env", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

env:
  # Goldens are rendered on Linux with this exact version; keep in sync with docs/runbooks/local-dev.md.
  FLUTTER_VERSION: "3.47.5"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: OpenAPI spec copy matches the API contract
        run: diff -u ../docs/api/openapi.json openapi/bagmitra.openapi.json
      - name: Regenerate API client, Drift code and l10n; fail on drift
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib > /dev/null
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests incl. goldens, offline->online sync, architecture rules
        run: flutter test --coverage
      - name: Logic coverage gate (80%)
        run: dart run tool/coverage_gate.dart 80
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: app/test/**/failures/

  apk:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (split per ABI keeps each download small)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=../product.env
      - name: Report APK sizes (budget < 25 MB)
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bagmitra-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  emulator:
    # Headless Android emulator: API 33, pixel_5-class AVD, 2 GB RAM. Installs the debug build, runs the
    # integration tests in app/integration_test and uploads screenshots (OPEN_QUESTIONS Q4).
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Free runner disk (the system image needs several GB)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the debug APK before the emulator starts (a Gradle build next to a running emulator exhausts the runner)
        run: flutter build apk --debug --dart-define-from-file=../product.env
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disable-animations: true
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            mkdir -p ../emulator-shots
            adb logcat -c
            set +e
            timeout 900 flutter test integration_test --dart-define-from-file=../product.env 2>&1 | tee ../emulator-shots/test.log
            status=${PIPESTATUS[0]}
            adb exec-out screencap -p > ../emulator-shots/final.png
            adb logcat -d -t 2000 > ../emulator-shots/logcat.txt
            tail -n 60 ../emulator-shots/test.log
            exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: emulator-shots/
