name: bagmitra
description: "BagMitra — offline-first orchard management for Indian fruit growers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  chopper: ^8.7.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  geolocator: ^14.1.2
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  swagger_dart_code_generator: ^4.1.1
  json_serializable: ^6.14.1
  chopper_generator: ^8.7.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/demo/
    - assets/config/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
