# BagMitra API on one VPS: the API container behind Caddy, which gets and renews the HTTPS
# certificate by itself. Steps: docs/runbooks/vps-deploy.md. Run from this folder:
#   docker compose up -d --build
# Add `--profile localdb` to also run PostgreSQL on this server (see the runbook for the trade-off).
services:
  api:
    build: ../api
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    # Tables are created / updated by the migrations on every start; the knowledge seed only adds
    # draft cards and sources (it never overwrites a reviewed card).
    command: sh -c "alembic upgrade head && python -m bagmitra_api.kb.seed && uvicorn bagmitra_api.asgi:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  # Optional: a PostgreSQL on this server instead of Supabase's. Then set in .env
  # DATABASE_URL=postgresql+asyncpg://postgres:<DB_PASSWORD>@db:5432/bagmitra
  db:
    profiles: ["localdb"]
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}  # only the localdb profile uses it
      POSTGRES_DB: bagmitra
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

volumes:
  caddy_data:
  caddy_config:
  pgdata:
