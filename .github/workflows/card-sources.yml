name: Card sources

# Owner 2026-11-10 (Q128 follow-up): the knowledge-card points that the AI did not find in their
# cited source are reviewed by reading the sources. This run fetches every source the cards cite
# (no secrets, no model call) and keeps, per point, the best-matching passages of each source and
# the numbers not found there, as a 7-day artifact for the reviewer. It changes nothing.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: extra page URLs (space-separated) whose visible text is printed, e.g. the right page of a section a card cites"
        required: false
        default: ""
        type: string
      raw:
        description: "Feed source checks: print each URL's raw response (status, type, feed and page links, first 20,000 characters) and its host's robots.txt, fetched with the feed adapters' own User-Agent, instead of the visible text"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  passages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e .
      - name: Fetch the cited sources and write the reviewer file
        if: ${{ !inputs.raw }}
        env:
          ENVIRONMENT: test
        run: |
          python -m bagmitra_api.kb.card_check ../app/assets/config/practice_cards.json \
            --passages "$RUNNER_TEMP/card_passages.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d), 'points')" \
            "$RUNNER_TEMP/card_passages.json"
          # The artifact store is not reachable from every reviewer's network; the job log is.
          echo "::group::card_passages.json"
          cat "$RUNNER_TEMP/card_passages.json"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.raw }}
        with:
          name: card-passages
          path: ${{ runner.temp }}/card_passages.json
          retention-days: 7
      - name: Print raw responses and robots.txt (feed source checks)
        if: ${{ inputs.urls != '' && inputs.raw }}
        env:
          URLS: ${{ inputs.urls }}
          ENVIRONMENT: test
        run: |
          python - <<'PY'
          import asyncio, os, re
          from urllib.parse import urlsplit
          import httpx
          from bagmitra_api.core.settings import get_settings
          from bagmitra_api.feed.extract import html_text
          AGENT = get_settings().feed_fetch_user_agent  # what the feed cron sends
          LIMIT = 20000
          OUT = os.path.join(os.environ["RUNNER_TEMP"], "raw")  # full bodies, for test fixtures
          os.makedirs(OUT, exist_ok=True)
          async def main():
              async with httpx.AsyncClient(follow_redirects=True, timeout=45) as http:
                  robots_seen = set()
                  for url in os.environ["URLS"].split():
                      parts = urlsplit(url)
                      host = f"{parts.scheme}://{parts.netloc}"
                      for target, label in ((host + "/robots.txt", "ROBOTS"), (url, "RAW")):
                          if label == "ROBOTS" and host in robots_seen:
                              continue
                          robots_seen.add(host)
                          print(f"::group::{label} {target}")
                          try:
                              r = await http.get(target, headers={"User-Agent": AGENT})
                              print("STATUS", r.status_code, "TYPE", r.headers.get("content-type"), "FINAL", r.url, "BYTES", len(r.content))
                              body = r.text
                              n = len(os.listdir(OUT))
                              with open(os.path.join(OUT, f"{n:02d}.body"), "wb") as f:
                                  f.write(r.content)
                              with open(os.path.join(OUT, "index.txt"), "a") as f:
                                  f.write(f"{n:02d} {r.status_code} {target}\n")
                              if label == "RAW" and "html" in (r.headers.get("content-type") or ""):
                                  # A page: its feed links and its link list (text + href), then the head of the body.
                                  for m in re.finditer(r'<link[^>]+(?:rss|atom)[^>]*>', body, re.I):
                                      print("FEED", m.group(0))
                                  seen = set()
                                  for href, text in re.findall(r'<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>', body, re.I | re.S):
                                      text = " ".join(re.sub(r"<[^>]+>", " ", text).split())[:120]
                                      if (href, text) not in seen and len(seen) < 400:
                                          seen.add((href, text))
                                          print("A", href, "|", text)
                                  # Visible text (what the feed's extractor reads), then the raw
                                  # tables / lists that carry document links (fixture material).
                                  print("TEXT", " ".join(html_text(r.content).split())[:8000])
                                  for m in re.finditer(r'<meta[^>]+(?:og:title|published_time)[^>]*>', body, re.I):
                                      print("META", m.group(0)[:400])
                                  for block in re.findall(r"<table.*?</table>|<ul.*?</ul>", body, re.I | re.S):
                                      if re.search(r"\.pdf|SchemeData|ViewGr", block, re.I):
                                          print("BLOCK", block[:LIMIT])
                                  body = body[:LIMIT // 10]
                              print(body[:LIMIT])
                          except httpx.HTTPError as exc:
                              print("ERROR", repr(exc))
                          print("::endgroup::")
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.urls != '' && inputs.raw }}
        with:
          name: raw-pages
          path: ${{ runner.temp }}/raw
          retention-days: 7
      - name: Print extra pages
        if: ${{ inputs.urls != '' && !inputs.raw }}
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python - <<'PY'
          import asyncio, io, os, re
          from urllib.parse import urljoin
          import httpx, pypdf
          from bagmitra_api.feed.extract import extract
          from bagmitra_api.kb.card_check import fetch_text
          # Some government hosts answer 403 to a non-browser User-Agent: one retry with a
          # generic one. An HTML page also lists its document links, to find the right file.
          BROWSER = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"}
          async def main():
              async with httpx.AsyncClient(follow_redirects=True) as http:
                  for url in os.environ["URLS"].split():
                      text, reason = await fetch_text(http, url)
                      page = None
                      if reason == "HTTP 403" or not reason:
                          try:
                              page = await http.get(url, headers=BROWSER, timeout=60)
                          except httpx.HTTPError as exc:
                              reason = reason and f"{reason}; browser User-Agent: {exc!r}"
                      is_pdf = page is not None and page.content.startswith(b"%PDF")
                      if reason and page is not None:
                          if page.status_code >= 400:
                              reason += f"; browser User-Agent: HTTP {page.status_code}"
                          else:
                              text = extract(page.content, "pdf" if is_pdf else "html").text
                              reason = None if text.strip() else reason + "; no text"
                      print("::group::" + url)
                      print(reason or text[:200000])
                      if is_pdf:  # the edition: the file's own dates and page count
                          pdf = pypdf.PdfReader(io.BytesIO(page.content))
                          print("META", len(pdf.pages), "pages", dict(pdf.metadata or {}), "Last-Modified:", page.headers.get("last-modified"))
                      if page is not None and page.status_code < 400 and not is_pdf:
                          for href in sorted(set(re.findall(r'href="([^"]+\.pdf[^"]*)"', page.text, re.I))):
                              print("LINK", urljoin(str(page.url), href))
                      print("::endgroup::")
          asyncio.run(main())
          PY
