name: Release APK

# The production APK for growers (audit RL-01 / RL-02 / P1 / R5). Started by hand only, from main:
# GitHub -> Actions -> "Release APK" -> Run workflow. Steps for the owner: docs/runbooks/release-apk.md.
# - No DEV_GALLERY / TEST_BUILD: no developer screens, no test badge.
# - Signed with the owner's release key; the run stops when any of its four secrets is missing
#   (never the debug key), and the signature is checked after the build.
# - arm64-v8a and armeabi-v7a only (no x86_64, no universal), obfuscated, symbols kept briefly.
# - Both APKs carry the same version code: this workflow's run number, which only rises.
# The Test APK workflow (release-test-apk.yml) is unchanged and stays the testers' build.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to growers, e.g. 1.0.0"
        required: true
        type: string
      sarkari_sandesh:
        description: "Sarkari Sandesh feed in this release"
        required: true
        default: "off"
        type: choice
        options: ["off", "on"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check inputs and secrets
        env:
          REF: ${{ github.ref }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          failed=0
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release APK workflow from main (this run is on $REF)"
            failed=1
          fi
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version_name must look like 1.0.0"
            failed=1
          fi
          # Without the release key the APK would not upgrade growers' installs; without the
          # server and login secrets it would run in the offline demo mode.
          for key in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                     API_BASE_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Secret $key is not set (docs/runbooks/release-apk.md)"
              failed=1
            fi
          done
          exit $failed
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Names and numbers
        id: meta
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          code="${{ github.run_number }}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=release-$VERSION_NAME-$code" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 does not decode to a file"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build production APKs
        working-directory: app
        env:
          RELEASE_BUILD: "true"
          BUILD_NUMBER: ${{ steps.meta.outputs.code }}
          BUILD_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SARKARI_SANDESH: ${{ inputs.sarkari_sandesh }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" \
            --android-project-arg=force-version-code-ignoring-abi=true \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file=../product.env \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SARKARI_SANDESH="$SARKARI_SANDESH"
      - name: Check signature and version codes
        env:
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apks=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a; do
            apk="$apks/app-$abi-release.apk"
            [ -f "$apk" ] || { echo "::error::$abi APK was not built"; exit 1; }
            certs=$("$tools/apksigner" verify --print-certs "$apk")
            if printf '%s' "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$abi APK is signed with the debug key"; exit 1
            fi
            got=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            [ "$got" = "$CODE" ] || { echo "::error::$abi versionCode is $got, expected $CODE"; exit 1; }
            echo "$abi: versionCode $got, $(printf '%s' "$certs" | grep -m1 'certificate SHA-256')"
          done
          for extra in app-x86_64-release.apk app-release.apk; do
            if [ -f "$apks/$extra" ]; then echo "::error::unexpected $extra"; exit 1; fi
          done
      - name: Name the files
        run: |
          out=release-files
          mkdir -p "$out"
          apks=app/build/app/outputs/flutter-apk
          prefix="bagmitra-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}"
          for abi in arm64-v8a armeabi-v7a; do
            cp "$apks/app-$abi-release.apk" "$out/$prefix-$abi.apk"
          done
          ls -l "$out"
      # Symbols turn obfuscated crash stacks back into names. Kept briefly; a full artifact quota
      # must not stop the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bagmitra-symbols-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}
          path: app/build/symbols
          retention-days: 7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          gh release create "$tag" release-files/*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "BagMitra ${{ steps.meta.outputs.name }} (version code ${{ steps.meta.outputs.code }})" \
            --notes "Production APKs. Upload the arm64-v8a file to the server (docs/runbooks/vps-deploy.md), then set APP_LATEST_VERSION_CODE=${{ steps.meta.outputs.code }} and APP_LATEST_VERSION_NAME=${{ steps.meta.outputs.name }}." \
            || gh release upload "$tag" release-files/*.apk --clobber
          {
            echo "### BagMitra ${{ steps.meta.outputs.name }}"
            echo "- version code: **${{ steps.meta.outputs.code }}**"
            echo "- release: $tag"
            echo "- server .env: \`APP_LATEST_VERSION_CODE=${{ steps.meta.outputs.code }}\`, \`APP_LATEST_VERSION_NAME=${{ steps.meta.outputs.name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
